<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Council of Activity Selection (CoAS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Load the hardcoded activity data -->
    <script src="data.js"></script>
    <style>
        select option {
            background: #4a5568;
            color: white;
        }
        .time-input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.8;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen gradient-bg text-white font-sans">
    <div class="container mx-auto px-4 py-8">
        <!-- Header with Date -->
        <header class="mb-12 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-2">Council of Activity Selection</h1>
            <h2 class="text-xl md:text-2xl opacity-80 mb-2">Today's Activity</h2>
            <div id="currentDate" class="text-xl md:text-2xl opacity-90"></div>
        </header>

        <!-- Main Content -->
        <main class="max-w-3xl mx-auto">
            <!-- Activity Display Card -->
            <div id="activityDisplay" class="glass-effect rounded-2xl p-6 mb-8 shadow-xl">
                <h2 class="text-2xl font-semibold mb-4 flex items-center">
                    <i class="fas fa-calendar-check mr-3"></i> Current Activity
                </h2>
                <div class="space-y-4">
                    <div>
                        <p class="text-sm opacity-80">Selected Activity:</p>
                        <p id="displayActivity" class="text-xl font-medium"></p>
                    </div>
                    <div>
                        <p class="text-sm opacity-80">Start Time:</p>
                        <p id="displayTime" class="text-xl font-medium"></p>
                    </div>
                    <div id="displayImageContainer" class="hidden">
                        <p class="text-sm opacity-80 mb-2">Activity Image:</p>
                        <img id="displayImage" src="" alt="Activity image" class="w-full rounded-xl shadow-lg max-h-96 object-cover">
                    </div>
                </div>
            </div>
        </main>

        <footer class="mt-16 text-center text-sm opacity-70">
            <p>© <span id="currentYear"></span> Council of Activity Selection. All rights reserved.</p>
            <p class="mt-1">Activity data is hardcoded. Refresh the page to get the latest update.</p>
        </footer>
    </div>

    <script>
        // Update current date
        function updateDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', options);
            document.getElementById('currentYear').textContent = now.getFullYear();
        }
        
        // Function to update the display view with the hardcoded data
        function updateDisplayView() {
            // Use the hardcoded data directly
            if (coasActivity.activity) {
                document.getElementById('displayActivity').textContent = coasActivity.activity;
            }
            
            // Format the time for display (convert 24h to 12h)
            if (coasActivity.startTime) {
                let [hours, minutes] = coasActivity.startTime.split(':');
                hours = parseInt(hours);
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // the hour '0' should be '12'
                document.getElementById('displayTime').textContent = `${hours}:${minutes} ${ampm}`;
            }
            
            // Show image if it exists
            if (coasActivity.imageUrl) {
                document.getElementById('displayImage').src = coasActivity.imageUrl;
                document.getElementById('displayImageContainer').classList.remove('hidden');
            }
        }

        // Initialize
        updateDate();
        updateDisplayView();
    </script>
</body>
</html>
