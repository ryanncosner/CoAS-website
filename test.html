<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Council of Activity Selection (CoAS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        select option {
            background: #4a5568;
            color: white;
        }
        .time-input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.8;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen gradient-bg text-white font-sans">
    <div class="container mx-auto px-4 py-8">
        <!-- Header with Date -->
        <header class="mb-12 text-center">
            <h1 class="text-4xl md:text-5xl font-bold mb-2">Council of Activity Selection</h1>
            <h2 class="text-xl md:text-2xl opacity-80 mb-2">Today's Activity</h2>
            <div id="currentDate" class="text-xl md:text-2xl opacity-90"></div>
        </header>

        <!-- Main Content -->
        <main class="max-w-3xl mx-auto">
            <!-- View Toggle -->
            <div class="flex justify-center mb-6">
                <button id="viewToggle" class="px-4 py-2 rounded-full bg-white/20 hover:bg-white/30 transition-all flex items-center text-sm">
                    <i class="fas fa-eye mr-2"></i> Show Current Activity
                </button>
            </div>

            <!-- Activity Display Card (Hidden by default) -->
            <div id="activityDisplay" class="glass-effect rounded-2xl p-6 mb-8 shadow-xl hidden">
                <h2 class="text-2xl font-semibold mb-4 flex items-center">
                    <i class="fas fa-calendar-check mr-3"></i> Current Activity
                </h2>
                <div class="space-y-4">
                    <div>
                        <p class="text-sm opacity-80">Selected Activity:</p>
                        <p id="displayActivity" class="text-xl font-medium"></p>
                    </div>
                    <div>
                        <p class="text-sm opacity-80">Start Time:</p>
                        <p id="displayTime" class="text-xl font-medium"></p>
                    </div>
                    <div id="displayImageContainer" class="hidden">
                        <p class="text-sm opacity-80 mb-2">Activity Image:</p>
                        <img id="displayImage" src="" alt="Activity image" class="w-full rounded-xl shadow-lg max-h-96 object-cover">
                    </div>
                </div>
            </div>

            <!-- Activity Input Section (Time Selection + Image) -->
            <div id="activityInputSection">
                <!-- Time Selection Card -->
                <div class="glass-effect rounded-2xl p-6 mb-8 shadow-xl">
                <h2 class="text-2xl font-semibold mb-4 flex items-center">
                    <i class="fas fa-tasks mr-3"></i> Today's Activity
                </h2>
                
                <div class="mb-6">
                    <label for="activity" class="block mb-2 text-sm font-medium">Select today's activity:</label>
                    <select id="activity" class="w-full p-3 rounded-lg bg-white/10 border border-white/20 focus:ring-2 focus:ring-white/50 focus:outline-none text-white placeholder-white/70">
                        <option value="">-- Select Activity --</option>
                        <option value="Grounded">Grounded</option>
                        <option value="Fortnite">Fortnite</option>
                        <option value="other">Other Activity</option>
                        <option value="test">Test</option>
                    </select>
                </div>

                <h3 class="text-xl font-semibold mb-4 flex items-center">
                    <i class="fas fa-clock mr-3"></i> Activity Start Time
                </h3>
                
                <div class="flex flex-col md:flex-row gap-4 items-start">
                    <div class="flex-1 w-full">
                        <label for="startTime" class="block mb-2 text-sm font-medium">Choose activity start time:</label>
                        <input type="time" id="startTime" class="time-input w-full p-3 rounded-lg bg-white/10 border border-white/20 focus:ring-2 focus:ring-white/50 focus:outline-none">
                    </div>
                    <button id="setTimeBtn" class="mt-6 md:mt-0 px-6 py-3 bg-white text-indigo-800 font-bold rounded-lg hover:bg-white/90 transition-all duration-300 shadow-lg flex items-center">
                        <i class="fas fa-check mr-2"></i> Set Time
                    </button>
                </div>
            </div>

            <!-- Custom Image Section -->
            <div class="glass-effect rounded-2xl p-6 shadow-xl mb-8">
                <h2 class="text-2xl font-semibold mb-4 flex items-center">
                    <i class="fas fa-image mr-3"></i> Activity Visual Reference
                </h2>
                
                <div class="relative group">
                    <div id="imagePlaceholder" class="w-full h-64 md:h-80 bg-white/10 rounded-xl flex flex-col items-center justify-center cursor-pointer transition-all duration-300 hover:bg-white/15 border-2 border-dashed border-white/30">
                        <i class="fas fa-image text-4xl opacity-50 mb-3"></i>
                        <p class="text-sm opacity-70">Click to upload your image</p>
                    </div>
                    <input type="file" id="imageUpload" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                </div>
                
                <div id="uploadedImageContainer" class="hidden mt-4">
                    <img id="uploadedImage" src="" alt="Your custom image" class="w-full rounded-xl shadow-lg max-h-96 object-cover">
                    <button id="removeImageBtn" class="mt-3 px-4 py-2 bg-red-500/20 hover:bg-red-500/30 rounded-lg transition-all flex items-center text-sm">
                        <i class="fas fa-trash mr-2"></i> Remove Image
                    </button>
                </div>
                </div>
            </div>

        </main>

        <footer class="mt-16 text-center text-sm opacity-70">
            <p>© <span id="currentYear"></span> Time Tracker. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // Update current date
        function updateDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', options);
            document.getElementById('currentYear').textContent = now.getFullYear();
        }
        
        // Time selection functionality
        document.getElementById('setTimeBtn').addEventListener('click', function() {
            const activity = document.getElementById('activity').value;
            const timeInput = document.getElementById('startTime').value;
            
            if (!activity) {
                alert('Please select an activity');
                return;
            }
            if (!timeInput) {
                alert('Please select a start time');
                return;
            }
            
            if (activity === 'test') {
                // Convert to 12-hour format for test alert
                let [hours, minutes] = timeInput.split(':');
                hours = parseInt(hours);
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // the hour '0' should be '12'
                alert(`🚀 Test Activity Activated! 🎉\nTime set to: ${hours}:${minutes} ${ampm}\n\nReady for some fun testing!`);
            } else {
                // Convert to 12-hour format for alert
                let [hours, minutes] = timeInput.split(':');
                hours = parseInt(hours);
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // the hour '0' should be '12'
                alert(`Activity set to: ${activity} at ${hours}:${minutes} ${ampm}`);
            }
        });
        
        // Image upload functionality
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('uploadedImage').src = event.target.result;
                    document.getElementById('uploadedImageContainer').classList.remove('hidden');
                    document.getElementById('imagePlaceholder').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });
        
        document.getElementById('removeImageBtn').addEventListener('click', function() {
            document.getElementById('uploadedImage').src = '';
            document.getElementById('uploadedImageContainer').classList.add('hidden');
            document.getElementById('imagePlaceholder').classList.remove('hidden');
            document.getElementById('imageUpload').value = '';
        });
        
        // View toggle functionality
        document.getElementById('viewToggle').addEventListener('click', function() {
            const display = document.getElementById('activityDisplay');
            const input = document.getElementById('activityInputSection');
            
            if (display.classList.contains('hidden')) {
                // Update display with current values when showing
                const activity = document.getElementById('activity').value;
                const timeInput = document.getElementById('startTime').value;
                
                if (activity && timeInput) {
                    document.getElementById('displayActivity').textContent = document.getElementById('activity').options[document.getElementById('activity').selectedIndex].text;
                    // Convert to 12-hour format for display
                    let [hours, minutes] = timeInput.split(':');
                    hours = parseInt(hours);
                    const ampm = hours >= 12 ? 'PM' : 'AM';
                    hours = hours % 12;
                    hours = hours ? hours : 12; // the hour '0' should be '12'
                    document.getElementById('displayTime').textContent = `${hours}:${minutes} ${ampm}`;
                    
                    const uploadedImage = document.getElementById('uploadedImage').src;
                    if (uploadedImage) {
                        document.getElementById('displayImage').src = uploadedImage;
                        document.getElementById('displayImageContainer').classList.remove('hidden');
                    } else {
                        document.getElementById('displayImageContainer').classList.add('hidden');
                    }
                }
                
                display.classList.remove('hidden');
                input.classList.add('hidden');
                this.innerHTML = '<i class="fas fa-edit mr-2"></i> Edit Activity';
            } else {
                display.classList.add('hidden');
                input.classList.remove('hidden');
                this.innerHTML = '<i class="fas fa-eye mr-2"></i> Show Current Activity';
            }
        });

        // Initialize
        updateDate();
        
        // Set default time to current time in 12-hour format
        const now = new Date();
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12; // the hour '0' should be '12'
        const minutes = now.getMinutes().toString().padStart(2, '0');
        document.getElementById('startTime').value = `${hours}:${minutes}`;
    </script>
</body>
</html>
